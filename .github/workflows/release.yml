name: release

# Publishes probe.sh as a GitHub release asset:
#  - automatically on every push to main that changes probe.sh, when the
#    VERSION inside it has no release yet (so merging a version bump = release)
#  - on a pushed v* tag
#  - manually from the Actions tab

on:
  push:
    branches: [main]
    paths: [probe.sh]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0); empty = VERSION from probe.sh"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: shellcheck -s dash probe.sh

      - name: Resolve tag
        id: tag
        run: |
          version=$(sed -n 's/^VERSION="\(.*\)"/\1/p' probe.sh)
          [ -n "$version" ] || { echo "no VERSION in probe.sh"; exit 1; }
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"
          else tag="v$version"; fi
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match VERSION=$version in probe.sh"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = branch ]; then
              echo "release $TAG already exists; bump VERSION in probe.sh to publish a new one"
              exit 0
            fi
            gh release upload "$TAG" probe.sh --clobber
          else
            gh release create "$TAG" probe.sh --target "$GITHUB_SHA" \
              --title "podkop-probe $TAG" --generate-notes
          fi
