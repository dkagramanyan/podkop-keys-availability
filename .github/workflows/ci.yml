name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s dash probe.sh agent/podkop-agent agent/podkop-agent.init agent/install.sh

  manager:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "manager[test]"
      - run: python -m pytest -q manager/tests
      - run: node --check manager/podkop_manager/static/app.js
