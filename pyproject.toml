[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podkop-manager"
description = "Manage podkop on OpenWrt routers from a Linux server"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "asyncssh>=2.14",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
podkop-manager = "podkop_manager.__main__:main"

[tool.setuptools]
packages = ["podkop_manager"]

[tool.setuptools.dynamic]
version = {attr = "podkop_manager.__version__"}

[tool.setuptools.package-data]
podkop_manager = ["static/*"]
